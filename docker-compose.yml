services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PROD: "False"
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/postgres
      SECRET_KEY: dev-secret-change-me
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      SMTP_SERVER: localhost
      SMTP_PORT: "587"
      SMTP_USER: dev
      SMTP_PASSWORD: dev
      SMTP_USE_TLS: "False"
      SENDER_EMAIL: noreply@simplesplit.local
      EMAIL_ACCOUNT_VERIFICATION: "False"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PUBLIC_BACKEND_URL: http://backend:8000
      PUBLIC_FRONTEND_URL: http://localhost:3000
      PUBLIC_ADAPTER: node
      PUBLIC_MOCK_MODE: "off"
      PUBLIC_FRONTEND_URL_CHANGABLE: "off"
    depends_on:
      - backend

volumes:
  postgres_data:
